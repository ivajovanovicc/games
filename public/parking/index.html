<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Parking majstor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a111f;--panel:#0f1828;--card:#111b2d;--line:#1f2c44;--acc:#3ddc84;--acc2:#16a34a;--mut:#8ea0bb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#hud{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bg);flex:none}
.hbtn{background:var(--panel);border:1px solid var(--line);color:#fff;width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
.hbtn svg{width:20px;height:20px}
#lvlName{flex:1;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
#lvlName small{display:block;font-weight:600;font-size:11px;color:var(--mut);letter-spacing:.3px}
#lvlName em{font-style:normal;color:var(--acc)}
.lg{color:var(--acc);font-style:italic;font-weight:900;margin-right:4px;letter-spacing:-2px}
#timer{font-variant-numeric:tabular-nums;font-size:15px;font-weight:800;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 10px;height:42px;display:flex;align-items:center;gap:6px;min-width:76px;justify-content:center}
#timer svg{width:18px;height:18px}
#stage{flex:1;position:relative;min-height:0;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(10,17,31,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-left:3px solid var(--acc);padding:9px 14px;border-radius:12px;font-size:14px;font-weight:700;width:max-content;max-width:90%;text-align:center;transition:opacity .6s;pointer-events:none;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#skip{position:absolute;right:12px;top:12px;background:rgba(10,17,31,.85);border:1px solid var(--line);color:#e2e8f0;border-radius:10px;padding:5px 14px;font-size:13px;font-weight:800;display:none}
/* controls */
#controls{flex:none;padding:8px 10px;padding-bottom:max(12px,env(safe-area-inset-bottom));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));background:var(--bg)}
.cpanel{display:flex;align-items:center;justify-content:space-between;gap:5px;height:136px;padding:10px 8px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(#0f1828,#0b1322)}
.grp{display:flex;gap:6px;align-items:center;height:100%}
.vdiv{flex:none;width:1px;align-self:stretch;margin:10px 2px;background:var(--line)}
.cbtn{border:none;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-direction:column;touch-action:none;transition:transform .06s,filter .06s}
.cbtn.on{transform:translateY(3px) scale(.95);filter:brightness(1.25)}
.steer{flex:0 1 auto;width:clamp(40px,11.5vw,58px);height:clamp(52px,15vw,66px);border-radius:14px;background:linear-gradient(#1c283d,#131d2f);border:1px solid #2a3a56;box-shadow:0 4px 0 #050a14}
.steer svg{width:46%;height:46%}
#wheel{flex:none;cursor:pointer;touch-action:none;width:clamp(56px,16vw,80px);height:clamp(56px,16vw,80px);transition:transform .05s linear;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
#gear{flex:none;width:clamp(40px,11vw,52px);height:100%;border-radius:14px;background:#0b1322;border:1px solid #2a3a56;gap:5px;padding:5px}
#gear span{flex:1;width:100%;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#64748b;background:#131d2f}
#gear span.act.d{color:#fff;background:linear-gradient(#4ade80,#22a35a)}
#gear span.act.r{color:#fff;background:linear-gradient(#fb923c,#ea580c)}
.pedal{height:92%;border-radius:12px 12px 16px 16px;font-size:10px;position:relative;overflow:hidden;letter-spacing:.3px}
.pedal::before{content:"";position:absolute;inset:9px 9px 26px;border-radius:7px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 5px,rgba(255,255,255,.12) 5px 10px)}
.pedal b{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-weight:900}
#brake{flex:none;height:92%;width:clamp(54px,14.5vw,74px);background:linear-gradient(#e5e7eb,#9ca3af);color:#1f2937;box-shadow:0 5px 0 #4b5563}
#gas{flex:none;width:clamp(50px,13.5vw,70px);height:100%;background:linear-gradient(#86efac,#34c26f);color:#052e16;box-shadow:0 5px 0 #15803d}
.pedal.on{box-shadow:0 1px 0 #111}
/* menu */
.screen{position:absolute;inset:0;z-index:10;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;background:var(--bg);padding-bottom:30px}
.hero{position:relative;height:178px;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.htxt{position:absolute;left:18px;top:26px;right:40%;z-index:2}
.htxt .bar{position:absolute;left:0;top:3px;width:3px;height:50px;border-radius:2px;background:rgba(61,220,132,.7)}
.htxt h1{margin-left:12px;font-size:clamp(24px,7vw,30px);line-height:1;font-weight:900;font-style:italic;letter-spacing:-.5px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.htxt h1 em{display:block;font-style:italic;color:#bbf7d0}
.chap{margin:12px 0 0 12px;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#bbf7d0;background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.25);padding:4px 10px;border-radius:20px;letter-spacing:.3px}
.storyb{display:flex;align-items:center;gap:6px;margin:8px 0 0 12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#e2e8f0;border-radius:10px;padding:5px 12px;font-size:12px;font-weight:700}
.ctabs{display:flex;gap:8px;padding:12px 14px 0}
.ctab{flex:1;border:1px solid var(--line);background:#0f1828;color:var(--mut);border-radius:12px;padding:9px 6px;font-size:13px;font-weight:800}
.ctab.on{color:#fff;border-color:rgba(61,220,132,.45);background:#122033}
.ctab i{font-style:normal;font-size:9px;font-weight:800;color:#052e16;background:#86efac;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:2px}
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;touch-action:pan-x pan-y;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;padding:14px 14px 4px}
.sech{display:flex;justify-content:flex-end;margin-bottom:10px}
.cnt{display:flex;align-items:center;gap:5px;font-weight:700;font-size:12px;color:var(--mut)}
.cnt b{color:#facc15;font-size:12px}
.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv{position:relative;text-align:left;border:1px solid var(--line);color:#fff;border-radius:14px;padding:11px 11px 10px;min-height:118px;background:linear-gradient(160deg,#121d30,#0e1727);display:flex;flex-direction:column;overflow:hidden}
.lv:active{transform:scale(.97)}
.lv.done{border-color:rgba(61,220,132,.35)}
.lv .no{font-size:22px;font-weight:800;line-height:1;color:#e2e8f0}
.lv .nm{margin-top:6px;font-size:13px;font-weight:700;line-height:1.2;z-index:1;color:#e2e8f0}
.lv .ill{position:absolute;right:6px;top:8px;width:46%;height:42px;opacity:.6}
.lv .bot{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between}
.lv .st{color:#facc15;font-size:11px;letter-spacing:1px}
.lv .st i{font-style:normal;color:#2a3a56}
.lv .ok{position:absolute;right:8px;bottom:30px;width:16px;height:16px;border-radius:50%;background:rgba(61,220,132,.18);color:#86efac;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:10px}
.df{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px}
.d1{background:rgba(74,222,128,.12);color:#86efac}.d2{background:rgba(250,204,21,.12);color:#fde68a}.d3{background:rgba(251,146,60,.12);color:#fdba74}.d4{background:rgba(248,113,113,.12);color:#fca5a5}
.endc{grid-column:1/-1;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:#111b2d;color:#fff;text-align:left}
.endc .ic{font-size:24px}
.endc b{display:block;font-size:14px;font-weight:800}
.endc small{color:var(--mut);font-weight:600;font-size:12px}
.pdots{display:flex;gap:6px;justify-content:center;margin:10px 0 0}
.pdots i{width:7px;height:7px;border-radius:50%;background:#1f2c44;cursor:pointer}
.pdots i.on{background:rgba(61,220,132,.8)}
.help{margin:18px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.6;color:#cbd5e1;font-weight:600}
.help b{color:var(--acc)}
#app{position:relative}
#carpick{position:absolute;right:12px;top:calc(max(8px,env(safe-area-inset-top)) + 52px);z-index:50;width:min(280px,86vw);background:rgba(15,24,40,.97);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:16px;padding:12px 14px 14px;box-shadow:0 16px 40px rgba(0,0,0,.6);display:none}
#carpick.show{display:block;animation:pop .25s cubic-bezier(.2,1.6,.4,1)}
#carpick .pt{font-weight:900;font-size:15px;font-style:italic;margin-bottom:6px}
#carprev{position:relative;display:block;width:100%;height:90px;border-radius:10px;background:#2b2f36}
#carpick .sw{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
#carpick .sw button{aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.15);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
#carpick .sw button.on{outline:3px solid var(--acc);outline-offset:2px}
#carpick .cname{text-align:center;margin-top:10px;font-size:13px;font-weight:700;color:var(--mut)}
/* overlays */
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.5);z-index:5}
#ov.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{background:rgba(15,24,40,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:20px;padding:22px 20px 18px;width:min(320px,88%);text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card .em{font-size:50px;line-height:1}
.card h2{font-size:24px;font-weight:900;margin:6px 0 4px;font-style:italic}
.card p{color:#cbd5e1;margin-bottom:6px;font-size:14px;font-weight:600}
.bigst{font-size:42px;letter-spacing:6px;margin:4px 0 8px}
.bigst span{display:inline-block;color:#facc15;text-shadow:0 3px 0 #a16207;animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
.bigst span.off{color:#2a3a56;text-shadow:none}
.btns{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.btns button{border:1px solid var(--line);border-radius:12px;padding:11px;font-size:16px;font-weight:800;color:#fff;background:#16223a}
.btns button.pri{background:linear-gradient(#4ade80,#16a34a);border:none;color:#052e16}
.btns button:active{transform:scale(.97)}
/* story */
#story{position:absolute;inset:0;z-index:30;display:none;background:var(--bg)}
#sc{position:absolute;inset:0;width:100%;height:100%}
#sskip{position:absolute;right:12px;top:12px;background:rgba(10,17,31,.6);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:5px 14px;font-size:13px;font-weight:800}
.scap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 16px;background:linear-gradient(rgba(10,17,31,0),rgba(10,17,31,.94) 30%);text-align:center}
#cap{font-size:17px;font-weight:700;line-height:1.4;margin:6px auto 12px;max-width:520px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#cap b{color:var(--acc)}
#cap small{font-size:13px;color:#a7f3d0}
#snext{border:none;border-radius:12px;padding:10px 28px;font-size:16px;font-weight:900;color:#052e16;background:linear-gradient(#4ade80,#16a34a);box-shadow:0 4px 0 #14532d}
#dots{display:flex;gap:6px;justify-content:center}#dots i{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.25)}#dots i.on{background:var(--acc);width:20px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button class="hbtn" id="bMenu" aria-label="Meni"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h11" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <div id="lvlName"></div>
    <div id="timer"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3" stroke-linecap="round"/></svg><span id="tval">0.0</span></div>
    <button class="hbtn" id="bCar" aria-label="Boja auta"></button>
    <button class="hbtn" id="bSound" aria-label="Zvuk"></button>
    <button class="hbtn" id="bRestart" aria-label="Ponovo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button>
  </div>
  <div id="carpick"><div class="pt">Boja auta</div><canvas id="carprev"></canvas><div class="sw" id="swatches"></div><div class="cname" id="cname"></div></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hint"></div>
    <button id="skip">Preskoči ▶</button>
    <div id="ov"><div class="card" id="card"></div></div>
    <div id="story"><canvas id="sc"></canvas><button id="sskip">Preskoči</button><div class="scap"><div id="dots"></div><div id="cap"></div><button id="snext">Dalje ▶</button></div></div>
    <div class="screen" id="menu">
      <div class="hero"><canvas id="hero"></canvas>
        <div class="htxt"><div class="bar"></div><h1>Parking<em>majstor</em></h1><div class="chap" id="chapLbl">Poglavlje 1 · Put kući</div><button class="storyb" id="bStory"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/></svg>Priča</button></div></div>
      <div class="ctabs"><button class="ctab" data-c="1">1 · Put kući</button><button class="ctab" data-c="2">2 · Letovanje <i>novo</i></button></div>
      <div class="pager" id="pager"></div>
      <div class="pdots" id="pdots"></div>
      <div class="help"><b>Kako se vozi:</b> ◀ ▶ volan (pusti = pravo) · <b>GAS</b> vozi · <b>KOČNICA</b> staje · <b>D / R</b> napred ili rikverc · sredina volana = <b>truba</b>. Uparkiran si kad je ceo auto u zelenom polju i stojiš. <b>U gradu</b> stani na crveno 🚦 i propusti pešake 🚶.</div>
    </div>
  </div>
  <div id="controls"><div class="cpanel">
    <div class="grp">
      <button class="cbtn steer" id="bLeft" aria-label="Levo"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <svg id="wheel" viewBox="0 0 100 100"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/></linearGradient></defs>
        <circle cx="50" cy="50" r="40" fill="none" stroke="url(#wg)" stroke-width="11"/><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
        <path d="M12 46 Q50 34 88 46 L82 56 Q50 48 18 56Z" fill="url(#wg)"/><path d="M42 54 L58 54 L56 88 L44 88Z" fill="url(#wg)"/><circle cx="50" cy="52" r="13" fill="#334155" stroke="url(#wg)" stroke-width="3"/><path d="M44 49h3l5-4v14l-5-4h-3z M55 48.5a5 5 0 0 1 0 7" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1.2" stroke-linejoin="round"/><rect x="47" y="8" width="6" height="8" rx="2" fill="#3ddc84"/></svg>
      <button class="cbtn steer" id="bRight" aria-label="Desno"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="vdiv"></div>
    <div class="grp">
      <button class="cbtn" id="gear" aria-label="Menjač"><span class="d act" id="gD">D</span><span class="r" id="gR">R</span></button>
      <button class="cbtn pedal" id="brake"><b>KOČNICA</b></button>
      <button class="cbtn pedal" id="gas"><b>GAS</b></button>
    </div>
  </div></div>
</div>
<script>
(function(){
const PI=Math.PI;
const UNLOCK_ALL=true;
const ACC=85,BRAKE=280,FRIC=45,MAXF=120,MAXR=55,STEER_MAX=0.62,STEER_RATE=3,WB=28;
const COLORS=['#3b82f6','#f59e0b','#10b981','#8b5cf6','#475569','#06b6d4','#f472b6','#94a3b8','#fbbf24','#334155','#2dd4bf','#a3e635','#fb923c'];
const SW=14; // sidewalk width around city blocks

const VT={car:[22,11],cabrio:[22,11],camper:[30,12],van:[26,12],scooter:[10,5]};
const SUMCOL=['#7dd3fc','#fda4af','#fde047','#86efac','#f8fafc','#fdba74','#c4b5fd','#5eead4','#f472b6','#60a5fa'];
let curTheme='city';
function car(x,y,ang,ci){return veh(x,y,ang,ci,curTheme==='summer'&&ci%5===2?'cabrio':'car')}
function cone(x,y){return {x,y,hw:6,hh:6,ang:0}}
function wall(x0,y0,x1,y1){return {x:(x0+x1)/2,y:(y0+y1)/2,hw:(x1-x0)/2,hh:(y1-y0)/2,ang:0}}
function spotLines(t,offs,len){const c=Math.cos(t.ang),s=Math.sin(t.ang);return offs.map(o=>{const cx=t.x-s*o,cy=t.y+c*o;return [cx-c*len,cy-s*len,cx+c*len,cy+s*len]})}
function rowLevel(skip,ci0,yc,wb){yc=yc||122;wb=wb||80;
  const cars=[],lines=[];
  for(let x=25;x<=375;x+=50) lines.push([x,wb+2,x,yc+43]);
  let i=0;for(let x=50;x<=350;x+=50){ if(x!==skip) cars.push(car(x,yc,i%3?PI/2:-PI/2,i+ci0)); i++; }
  return {cars,lines,walls:[wall(0,0,400,wb)]};
}
function lane(x0,y0,x1,y1,speed,count,ci,phase){return {pts:[[x0,y0],[x1,y1]],speed,count,ci,phase:phase||0}}
function loopPath(x0,y0,x1,y1,r,speed,count,ci,ccw){const pts=[];
  const arc=(cx,cy,a0)=>{for(let k=0;k<=6;k++){const a=a0+k*PI/12;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}};
  arc(x1-r,y0+r,-PI/2);arc(x1-r,y1-r,0);arc(x0+r,y1-r,PI/2);arc(x0+r,y0+r,PI);pts.push(pts[0].slice());
  if(ccw)pts.reverse();return {pts,speed,count,ci,phase:0}}

// ---------- city builder ----------
function City(w,h){return {w,h,walls:[],deco:[],gates:[],heads:[],signals:[],crossings:[],walkers:[],movers:[],cars:[],lines:[],cones:[]}}
function blk(C,x0,y0,x1,y1,kind,label,color){C.walls.push(wall(x0,y0,x1,y1));C.deco.push(['blk',x0,y0,x1,y1,kind,label||'',color||'#64748b'])}
function sidewalkWall(C,x0,y0,x1,y1){C.walls.push(wall(x0,y0,x1,y1));C.deco.push(['sidewalk',x0,y0,x1,y1])}
function crossing(C,a,b,sig,n){const cr={a,b,sig:sig||null,n:n||2};C.crossings.push(cr);C._lastCr=cr;

// ---------- geometry ----------
function corners(o){const c=Math.cos(o.ang),s=Math.sin(o.ang),ax=c*o.hw,ay=s*o.hw,bx=-s*o.hh,by=c*o.hh;
  return [{x:o.x+ax+bx,y:o.y+ay+by},{x:o.x+ax-bx,y:o.y+ay-by},{x:o.x-ax-bx,y:o.y-ay-by},{x:o.x-ax+bx,y:o.y-ay+by}]}
function overlap(a,b){if(Math.abs(a.x-b.x)>a.hw+a.hh+b.hw+b.hh||Math.abs(a.y-b.y)>a.hw+a.hh+b.hw+b.hh)return false;
  const ca=corners(a),cb=corners(b);
  for(const ang of [a.ang,a.ang+PI/2,b.ang,b.ang+PI/2]){const ux=Math.cos(ang),uy=Math.sin(ang);
    let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
    for(const p of ca){const d=p.x*ux+p.y*uy;if(d<a0)a0=d;if(d>a1)a1=d}
    for(const p of cb){const d=p.x*ux+p.y*uy;if(d<b0)b0=d;if(d>b1)b1=d}
    if(a1<b0||b1<a0)return false}
  return true}
function inObb(p,o){const dx=p.x-o.x,dy=p.y-o.y,c=Math.cos(o.ang),s=Math.sin(o.ang);
  return Math.abs(dx*c+dy*s)<=o.hw&&Math.abs(-dx*s+dy*c)<=o.hh}
function approach(v,t,m){return v>t?Math.max(t,v-m):Math.min(t,v+m)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,f){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  if(f<0){r*=1+f;g*=1+f;b*=1+f}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')'}

function sigState(id){const s=L.signals.find(q=>q.id===id);if(!s)return 'G';const u=((ltime-s.g0)%s.T+s.T)%s.T;return u<s.g?'G':u<s.g+s.y?'Y':'R'}

    const a={m,d,v:m.speed*(ty==='camper'?.8:1),type:ty,hw:VT[ty][0],hh:VT[ty][1],color:pal[(m.ci+i*4)%pal.length],brk:false};Object.assign(a,posAt(m,d));agents.push(a)}});

let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.033,(now-last)/1000);last=now;try{if(story){drawStory(dt);return}update(dt);draw(now)}catch(e){if(window.console)console.error(e)}}
resize();showMenu();requestAnimationFrame(frame);
let seen=false;try{seen=localStorage.getItem('pm_intro')==='1'}catch(e){}
if(!seen)setTimeout(()=>playStory(INTRO,()=>{try{localStorage.setItem('pm_intro','1')}catch(e){}}),300);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(L&&state!=='menu')bg=buildBg(L)});
window.__pm={ff2:(sec)=>{TESTNC=true;const st={ov:0,maxStuck:0,pairs:[]};const n=Math.round(sec*30);let R=rng(5);
  for(let k=0;k<n;k++){if(k%1800===0){if((k/1800)%2===0&&agents.length){const a=agents[Math.floor(R()*agents.length)];P.x=a.x+Math.cos(a.ang)*70;P.y=a.y+Math.sin(a.ang)*70;P.ang=a.ang+(R()<.5?PI/2:0);P.v=0}else{P.x=-900;P.y=-900}}
    P.v=0;update(1/30);state='play';for(const a of agents){if(!a.dormant&&a.v<1){a.stopT=(a.stopT||0)+1/30;if(P.x>-500)a.stopT=Math.min(a.stopT,0);a.maxStop=Math.max(a.maxStop||0,a.stopT)}else a.stopT=0}

    for(let i=0;i<agents.length;i++)for(let j=i+1;j<agents.length;j++){const A=agents[i],B=agents[j];if(A.dormant||B.dormant||A.x<0||A.y<0||A.x>L.w||A.y>L.h)continue;if(overlap({x:A.x,y:A.y,hw:A.hw-2,hh:A.hh-1,ang:A.ang},{x:B.x,y:B.y,hw:B.hw-2,hh:B.hh-1,ang:B.ang})){st.ov++;if(st.pairs.length<3)st.pairs.push([i,j,Math.round(A.x),Math.round(A.y),A.why,B.why,A.ghost>0,B.ghost>0,Math.round(ltime)])}}}

  for(let i=0;i<agents.length;i++)for(let j=i+1;j<agents.length;j++){const A=agents[i],B=agents[j];if(A.dormant||B.dormant||A.x<0||A.y<0||A.x>L.w||A.y>L.h)continue;if(overlap({x:A.x,y:A.y,hw:A.hw-2,hh:A.hh-1,ang:A.ang},{x:B.x,y:B.y,hw:B.hw-2,hh:B.hh-1,ang:B.ang})){st.ov++;if(!st.pairs)st.pairs=[];if(st.pairs.length<6)st.pairs.push([i,j,Math.round(A.x),Math.round(A.y),+A.ang.toFixed(2),A.why,Math.round(B.x),Math.round(B.y),+B.ang.toFixed(2),B.why,A.ghost>0,B.ghost>0,Math.round(ltime)])}}}st.state=state;return st},ending:()=>playStory(ENDING,showMenu),startLevel:(i,q)=>startLevel(i,q),get:()=>({state,P,agents,peds,ltime,lvl,cam,L,time,crashWhy})};
